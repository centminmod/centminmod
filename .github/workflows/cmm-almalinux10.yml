name: Trigger AlmaLinux 10 Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - 141.00beta01
    # skip pushes that only change docs, changelogs or GitHub workflow files
    paths-ignore:
      - '.gitignore'
      - '**.md'
      - 'readme.txt'
      - 'changelog-*'
      - 'changes.html'
      - '.github/**'

permissions: {}

jobs:
  dispatch:
    # the private centminmod-claudecode copy of this branch has no
    # REPO_ACCESS_TOKEN, so only the public repo sends the dispatch
    if: github.repository == 'centminmod/centminmod'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger centminmod-workflows almalinux10.yml
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: centminmod/centminmod-workflows
          event-type: run-almalinux-10-workflow

# Anubis check for nginx auth_request subrequest mode, see anubis.conf for setup.
# Include in a server {} block (every location) or in chosen location blocks,
# together with 'include /usr/local/nginx/conf/anubis.conf;' once per server {}.
# Anubis answers 200 (pass), 401 (no valid Anubis cookie: redirect to the
# challenge) or 403 (policy DENY, returned to the client).
# A location with its own error_page directives does not inherit the 401 line
# below, so repeat it there.
auth_request /.within.website/x/cmd/anubis/api/check;
error_page 401 = @redirectToAnubis;

# Anubis proof-of-work bot challenge: helper locations for nginx auth_request
# subrequest mode. https://anubis.techaro.lol/docs/admin/configuration/subrequest-auth
#
# Not included by default. addons/anubis.sh install copies it to
# /usr/local/nginx/conf/anubis.conf (never overwriting an existing copy) and runs
# the anubis@centminmod service on 127.0.0.1:8923 with TARGET=" " (subrequest
# mode) and a bot policy whose DENY status is 403.
#
# nginx needs the auth_request module: NGINX_AUTHREQ='y' in
# /etc/centminmod/custom_config.inc, then a centmin.sh menu 4 nginx rebuild.
# 'addons/anubis.sh status' shows whether this nginx has it.
#
# In a vhost's server {} block:
#
#   server {
#     ...
#     # once per server {}: Anubis challenge pages and the 401 redirect
#     include /usr/local/nginx/conf/anubis.conf;
#     # every location of this server, or put this line in chosen locations only
#     include /usr/local/nginx/conf/anubis_check.conf;
#     ...
#   }
#
# - HTTPS vhosts: Anubis sets a Secure cookie by default, so a plain HTTP vhost
#   loops on the challenge unless COOKIE_SECURE=false is set in
#   /etc/anubis/centminmod.env (then: systemctl restart anubis@centminmod)
# - Browsers need JavaScript to pass, and search crawlers the policy does not
#   allow see the challenge page: test SEO impact before production use
# - Locations that must skip Anubis (feeds, APIs, webhooks, health checks) add
#   'auth_request off;'. The default policy already allows /.well-known/ (ACME
#   HTTP-01), robots.txt, favicon and sitemap.xml via X-Original-URI below
# - While Anubis is stopped, protected requests fail with 500: remove the
#   includes (nginx -t, then nprestart) before stopping or uninstalling it
#
# ^~ keeps regex locations such as drop.conf's 'location ~ /\.' (deny all) and
# staticfiles.conf's .js/.css rules from taking over Anubis's own paths
location ^~ /.within.website/ {
  proxy_pass http://127.0.0.1:8923;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Host $http_host;
  # original request URI for the policy's path rules in subrequest mode
  proxy_set_header X-Original-URI $request_uri;
  proxy_pass_request_body off;
  proxy_set_header content-length "";
  auth_request off;
}

location @redirectToAnubis {
  return 307 /.within.website/?redir=$scheme://$host$request_uri;
  auth_request off;
}

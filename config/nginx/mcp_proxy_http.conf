# MCP server, SSE and LLM API reverse proxy: http level part of mcp_proxy.conf
#
# Not included by default. Include it once at http level, inside http {} in
# /usr/local/nginx/conf/nginx.conf or at the top of a vhost file outside its
# server {} block, then include mcp_proxy.conf in the proxied location (usage
# at the top of /usr/local/nginx/conf/mcp_proxy.conf):
#
#   include /usr/local/nginx/conf/mcp_proxy_http.conf;

# Origin check. MCP Streamable HTTP servers MUST validate the Origin header and
# answer 403 when it is present and not allowed, to stop DNS rebinding attacks.
# Requests without Origin (CLI, desktop and server side MCP clients) pass.
# Browsers send Origin on cross-origin requests: list each web app origin
# allowed to call the endpoint, exactly as scheme://host[:port]. Do not allow
# an origin because it equals the request's Host: a DNS rebinding page sends
# a matching Host header too
map $http_origin $mcp_origin_allowed {
  default                        0;
  ""                             1;
  #"https://app.example.com"     1;
}

# Optional header check. MCP protocol revision 2026-07-28 clients copy the
# JSON-RPC method and params.name or params.uri into the Mcp-Method and
# Mcp-Name request headers so gateways can route without parsing the body.
# A gateway that routes or rate limits on those headers should not trust them
# unchecked; the spec has intermediaries answer 400 when header and body differ.
#
# Needs nginx 1.31.5+ built with NGINX_JSON='y' (nginx -V shows
# --with-http_json_module); Angie and freenginx do not have json_set. To use
# it, uncomment the block below and the matching if block in mcp_proxy.conf,
# and in the vhost's server {} block read the MCP request body before the
# location runs and keep it in memory, so $request_body is set:
#
#   client_body_early_read $mcp_body_early_read;
#   client_body_buffer_size 1m;   # a larger body goes to a temp file, then $request_body is empty and the check fails
#
# client_body_early_read must not cover gRPC or WebDAV locations. Set the
# path in $mcp_body_early_read to the MCP location's path. Requests without
# an Mcp-Method or Mcp-Name header (clients on revisions before 2026-07-28)
# and Base64 encoded Mcp-Name values (=?base64?...?=) are left to the MCP
# server. Plain maps with no regex captures, so they cannot overwrite the
# location's $1-$9
#
#map "$request_method:$uri" $mcp_body_early_read {
#  default                        0;
#  "POST:/mcp"                    1;
#}
#
#json_set $mcp_body_method $request_body method;
#json_set $mcp_body_name   $request_body params.name;
#json_set $mcp_body_uri    $request_body params.uri;

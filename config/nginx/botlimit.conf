# AI crawler maps: $aicrawler_category, $aicrawler_claim, $aicrawler_ipvendor
# and $aicrawler_verified. Centmin Mod ships empty copies, which change
# nothing below; /usr/local/src/centminmod/tools/nginx-aicrawlers.sh fills them
# from ai.robots.txt and the crawler IP lists vendors publish (update, or
# dry-run first; cron-install keeps them current)
include /usr/local/nginx/conf/aicrawlers/aicrawlers_ua.conf;
include /usr/local/nginx/conf/aicrawlers/aicrawlers_ip.conf;

# map user agents to $bot_agent (via $bot_agent_ua, see the $bot_agent map below)
# 0 = not rate limited
# 1 = not or rate limited less restrictive
# 2 = rate limited more 
# 3 = block completely
# http://www.botopedia.org/
# http://www.botreports.com/badbots/
map $http_user_agent $bot_agent_ua {
  default                    0;
  # general protections
  "~Mozilla/4.0"             2;
  "~MSIE\ 6.0"               3;
  "~MSIE\ 7.0"               2;
  "~*archive.org"            3;
  "~*Brandprotect"           3;

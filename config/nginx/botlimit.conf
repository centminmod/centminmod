  "~*Name\ Intelligence"     3;
  "~*Nameprotect"            3;
  "~*Picscout"               3;
  "~*Picsearch"              3;
  "~*Pixray"                 3;
  # bots whitelisted. Once nginx-aicrawlers.sh has run, Googlebot and bingbot
  # from IPs outside Google's and Bing's published lists get level 2 instead
  "~*Googlebot"              1;
  "~*bingbot"                1;
  "~*yahoo"                  1;
  # other bots rate limited or blocked
  "~*80legs"                 3;
  "~*Acunetix"               3;
  "~*AhrefsBot"              2;

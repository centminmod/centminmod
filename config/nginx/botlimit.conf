# AI crawlers by category (aicrawlers_ua.conf). Opt in per category with the
# levels above: 2 = rate limited by the botb zones, 3 = blocked by the
# vhost's "if ($bot_agent = '3')" lines below. 0 = no change, the default.
# Applies only to user agents the list above leaves at 0. Tokens come from
# ai.robots.txt and short ones (Dot, Cursor, Devin, Operator, Muse, Trae) can
# match other clients ('Code' is left out, it matches VS Code's user agent):
# leave tokens out with AICRAWLERS_SKIP='Cursor,Devin' in
# /etc/centminmod/custom_config.inc, then run nginx-aicrawlers.sh update
map $aicrawler_category $bot_agent_ai {
  default                    0;
  training                   0;   # collect content to train AI models: GPTBot, ClaudeBot, CCBot
  search                     0;   # AI search crawlers that link back: OAI-SearchBot, PerplexityBot, Applebot
  user                       0;   # fetches a person asked an AI assistant or agent for: ChatGPT-User, Claude-User
  other                      0;   # AI crawlers without a clear purpose
}

# final level: a whitelisted (1) user agent claiming Googlebot or bingbot from
# an IP outside that vendor's published list ($aicrawler_verified = 0) is rate
# limited (2), a user agent the list above leaves at 0 gets its AI category
# level, anything else keeps its level from the list above. With the empty AI
# crawler files Centmin Mod ships, this is always $bot_agent_ua. No regex
# captures here: they would overwrite $1-$9 of the vhost's location regex
map "$bot_agent_ua:$aicrawler_verified:$bot_agent_ai" $bot_agent {
  default                    $bot_agent_ua;
  "~^1:0:"                   2;
  "~^0:[01]?:1$"             1;
  "~^0:[01]?:2$"             2;
  "~^0:[01]?:3$"             3;
}

map $bot_agent $bot_iplimit {
	0    "";
	1    "";
	2    $binary_remote_addr;
}

# limits for googlebot and $bot_agent = 1
#limit_conn_zone $bot_iplimit zone=bota_connlimit:16m;
#limit_req_zone  $bot_iplimit zone=bota_reqlimitip:16m  rate=50r/s;
# limits for $bot_agent = 2
limit_conn_zone $bot_iplimit zone=botb_connlimit:16m;
limit_req_zone  $bot_iplimit zone=botb_reqlimitip:16m  rate=2r/s;


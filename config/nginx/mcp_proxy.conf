# MCP server, SSE and LLM API reverse proxy settings for one location
#
# Not included by default. Include /usr/local/nginx/conf/mcp_proxy_http.conf
# once at http level first (it defines $mcp_origin_allowed), then:
#
#   # http level, e.g. top of the vhost file outside server {}
#   upstream mcp_backend {
#     server 127.0.0.1:8000;
#     # MCP clients on protocol revisions 2025-03-26 to 2025-11-25 keep a
#     # server side session in the Mcp-Session-Id header: send each session to
#     # the same backend. Requests without the header are spread round robin
#     #hash $http_mcp_session_id consistent;
#     # or, for uneven LLM inference backends (nginx 1.31.0+): the backend
#     # with the lowest average time to the response header
#     #least_time header;
#   }
#
#   # in the vhost's server {} block
#   location /mcp {
#     include /usr/local/nginx/conf/mcp_proxy.conf;
#     proxy_pass http://mcp_backend;
#   }
#
# Use it instead of proxy.conf in that location. Its proxy_set_header lines
# replace any set at server or http level. A directive set both here and in
# the location fails nginx -t as a duplicate, so to change a value (such as
# 'proxy_http_version 2;' for an HTTP/2 backend, nginx 1.29.4+) copy this
# file under a new name and edit the copy.

# Streamable HTTP uses POST, plus GET and DELETE on MCP revisions before
# 2026-07-28. Browser clients on other origins also send OPTIONS preflight
# requests: add OPTIONS here and answer them with CORS headers if you need them.
# Non-capturing group, so a regex location's $1-$9 survive this check
if ($request_method !~ ^(?:GET|POST|DELETE)$) {
  return 405;
}

# Origin present and not allowed in mcp_proxy_http.conf (MCP spec: MUST 403)
if ($mcp_origin_allowed = 0) {
  return 403;
}

# Optional header check, with the json_set block in mcp_proxy_http.conf
#if ($mcp_body_method != $mcp_method_expect) {
#  return 400;
#}
#if ($mcp_body_target != $mcp_name_expect) {
#  return 400;
#}

# Stream SSE events and LLM tokens as they arrive. With 'proxy_buffering on;'
# instead, nginx buffers other responses and still streams any response the
# upstream sends with 'X-Accel-Buffering: no' (MCP servers SHOULD send it on
# SSE streams)
proxy_buffering off;
proxy_cache off;
# long lived SSE streams and slow LLM generations
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# ask the upstream for uncompressed responses, which nginx can stream
proxy_set_header Accept-Encoding "";

# No compression here: compressing SSE holds events back in the compressor.
# Uncomment brotli or zstd off when nginx has that module (NGINX_LIBBROTLI='y',
# NGINX_ZSTD='y'); without the module nginx -t rejects the directive
gzip off;
#brotli off;
#zstd off;
